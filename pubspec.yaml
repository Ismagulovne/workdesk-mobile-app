publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.0

  # Security & Biometrics
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.0
